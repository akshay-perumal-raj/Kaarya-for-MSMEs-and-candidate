<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAARYA — Don't Just Claim the Skill. Prove It.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0D0E;
  --panel-deep:#111416;
  --panel:#171A1D;
  --panel-elevated:#1D2124;
  --accent:#F7DC00;
  --accent-dim:#B9A700;
  --text:#F4F4F0;
  --text-2:#9CA3A7;
  --text-3:#60676C;
  --border:#2A2F33;
  --radius:3px;
  --font-sans:'Space Grotesk','Inter',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);height:100%;}
body{overflow-x:hidden;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
::selection{background:var(--accent);color:#0B0D0E;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:var(--panel-deep);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}

.mono{font-family:var(--font-mono);}

/* ---------- top nav ---------- */
.topnav{
  position:fixed;top:0;left:0;right:0;height:56px;z-index:500;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;background:rgba(11,13,14,0.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;}
.brand-mark{width:11px;height:11px;background:var(--accent);}
.brand-name{font-weight:700;letter-spacing:0.06em;font-size:16px;}
.nav-right{display:flex;align-items:center;gap:14px;}
.nav-pill{display:flex;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:3px;}
.nav-pill button{background:transparent;border:none;color:var(--text-2);font-size:12.5px;font-weight:600;letter-spacing:0.04em;padding:7px 16px;border-radius:16px;transition:all .18s;}
.nav-pill button.active{background:var(--accent);color:#12130a;}
.nav-status{font-size:11px;color:var(--text-3);font-family:var(--font-mono);}

.page{padding-top:56px;min-height:100vh;}

/* ---------- landing ---------- */
.hero{
  position:relative;height:calc(100vh - 56px);min-height:640px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  overflow:hidden;text-align:center;
}
.hero-3d{position:absolute;inset:0;opacity:0.55;}
.hero-3d canvas{width:100%;height:100%;display:block;}
.hero-fade{position:absolute;inset:0;background:radial-gradient(ellipse at center, rgba(11,13,14,0.15) 0%, rgba(11,13,14,0.75) 62%, rgba(11,13,14,0.97) 100%);}
.hero-content{position:relative;z-index:2;max-width:760px;padding:0 20px;}
.hero-eyebrow{font-family:var(--font-mono);font-size:12px;color:var(--accent);letter-spacing:0.12em;margin-bottom:18px;}
.hero-title{font-size:clamp(42px,8vw,84px);font-weight:700;line-height:0.98;letter-spacing:-0.02em;margin:0 0 20px;}
.hero-sub{font-size:19px;font-weight:600;color:var(--text);margin:0 0 8px;letter-spacing:0.01em;}
.hero-sub2{font-size:15px;color:var(--text-2);margin:0 0 42px;max-width:480px;margin-left:auto;margin-right:auto;line-height:1.5;}
.hero-choices{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}
.choice-card{
  width:250px;text-align:left;background:rgba(23,26,29,0.82);border:1px solid var(--border);
  border-radius:var(--radius);padding:22px 22px 20px;transition:border-color .18s, transform .18s;
  backdrop-filter:blur(6px);
}
.choice-card:hover{border-color:var(--accent);transform:translateY(-2px);}
.choice-label{font-family:var(--font-mono);font-size:11px;color:var(--text-3);letter-spacing:0.1em;margin-bottom:10px;}
.choice-title{font-size:17px;font-weight:700;margin-bottom:6px;}
.choice-desc{font-size:13px;color:var(--text-2);margin-bottom:18px;line-height:1.4;}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--border);background:var(--panel-elevated);color:var(--text);
  padding:12px 20px;font-size:13px;font-weight:600;letter-spacing:0.03em;border-radius:var(--radius);
  display:inline-flex;align-items:center;gap:8px;transition:all .15s;}
.btn:hover{border-color:var(--text-3);}
.btn-primary{background:var(--accent);color:#14150a;border-color:var(--accent);}
.btn-primary:hover{background:#ffe93a;}
.btn-primary:disabled{background:var(--panel-elevated);color:var(--text-3);border-color:var(--border);cursor:not-allowed;}
.btn-block{width:100%;justify-content:center;}
.btn-ghost{background:transparent;}
.btn-sm{padding:8px 14px;font-size:12px;}
.arrow{font-family:var(--font-mono);}

/* ---------- generic layout ---------- */
.container{max-width:1180px;margin:0 auto;padding:48px 24px 90px;}
.container-narrow{max-width:640px;margin:0 auto;padding:60px 24px 90px;}
.section-title{font-size:12px;font-family:var(--font-mono);letter-spacing:0.14em;color:var(--accent);margin-bottom:6px;}
.h1{font-size:32px;font-weight:700;letter-spacing:-0.01em;margin:0 0 8px;}
.h2{font-size:22px;font-weight:700;margin:0 0 8px;}
.lead{color:var(--text-2);font-size:14.5px;line-height:1.55;margin-bottom:30px;}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:26px;}
.panel-deep{background:var(--panel-deep);border:1px solid var(--border);border-radius:var(--radius);}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.field{margin-bottom:18px;}
.field label{display:block;font-size:11px;font-family:var(--font-mono);color:var(--text-2);letter-spacing:0.08em;margin-bottom:7px;}
.field input,.field select{width:100%;background:var(--panel-deep);border:1px solid var(--border);color:var(--text);
  padding:11px 12px;font-size:14px;border-radius:var(--radius);font-family:var(--font-sans);}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);}

/* ---------- skill dna ---------- */
.dna-row{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border:1px solid var(--border);
  border-radius:var(--radius);margin-bottom:10px;background:var(--panel);}
.dna-name{font-size:14.5px;font-weight:600;}
.badge{font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.08em;padding:5px 10px;border-radius:2px;font-weight:600;}
.badge-claimed{background:rgba(96,103,108,0.18);color:var(--text-2);border:1px solid var(--border);}
.badge-demonstrated{background:rgba(247,220,0,0.14);color:var(--accent);border:1px solid rgba(247,220,0,0.4);}
.badge-ready{background:rgba(122,214,120,0.14);color:#7ad678;border:1px solid rgba(122,214,120,0.4);}
.badge-near{background:rgba(247,220,0,0.14);color:var(--accent);border:1px solid rgba(247,220,0,0.4);}
.badge-not{background:rgba(255,110,110,0.12);color:#ff8a8a;border:1px solid rgba(255,110,110,0.35);}
.claim-note{display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:12px;color:var(--text-3);
  margin:22px 0;padding:14px 16px;border:1px dashed var(--border);border-radius:var(--radius);}

/* ---------- lab layout ---------- */
.lab-wrap{padding-top:56px;height:100vh;display:flex;flex-direction:column;}
.lab-header{padding:18px 26px 14px;border-bottom:1px solid var(--border);}
.lab-title{font-size:20px;font-weight:700;}
.lab-sub{font-family:var(--font-mono);font-size:11px;color:var(--accent);letter-spacing:0.1em;margin-top:2px;}
.task-card{margin-top:14px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 18px;display:flex;align-items:center;gap:26px;flex-wrap:wrap;}
.task-card .tlabel{font-family:var(--font-mono);font-size:10px;color:var(--text-3);letter-spacing:0.1em;}
.task-flow{display:flex;align-items:center;gap:14px;font-family:var(--font-mono);font-size:15px;}
.task-flow .dim{color:var(--text);font-weight:600;}
.task-flow .to{color:var(--text-3);}
.task-flow .target{color:var(--accent);font-weight:600;}
.task-controls-hint{color:var(--text-2);font-size:12.5px;margin-left:auto;}

.lab-body{flex:1;display:grid;grid-template-columns:1fr 340px;overflow:hidden;}
.viewport{position:relative;background:radial-gradient(ellipse at 50% 30%, #14171a 0%, #0B0D0E 75%);overflow:hidden;}
.viewport canvas{width:100%;height:100%;display:block;}
.ov{position:absolute;font-family:var(--font-mono);pointer-events:none;}
.ov-box{background:rgba(17,20,22,0.82);border:1px solid var(--border);padding:8px 12px;border-radius:2px;}
.ov-label{font-size:9.5px;color:var(--text-3);letter-spacing:0.1em;margin-bottom:3px;}
.ov-value{font-size:16px;font-weight:600;color:var(--text);}
.ov-value.accent{color:var(--accent);}
.ov-tl{top:20px;left:20px;}
.ov-tr{top:20px;right:20px;text-align:right;}
.ov-bl{bottom:20px;left:20px;display:flex;gap:16px;}
.ov-status{position:absolute;top:20px;left:50%;transform:translateX(-50%);font-family:var(--font-mono);
  font-size:12px;letter-spacing:0.12em;color:var(--accent);background:rgba(17,20,22,0.85);
  border:1px solid rgba(247,220,0,0.35);padding:8px 18px;border-radius:2px;display:none;}
.ov-status.show{display:block;}
.orbit-hint{position:absolute;bottom:20px;right:20px;font-family:var(--font-mono);font-size:10px;color:var(--text-3);}
.sound-toggle{position:absolute;top:20px;right:20px;background:rgba(17,20,22,0.85);border:1px solid var(--border);
  color:var(--text-2);width:34px;height:34px;border-radius:2px;font-size:14px;display:flex;align-items:center;justify-content:center;}

.controls-pane{border-left:1px solid var(--border);background:var(--panel-deep);overflow-y:auto;padding:20px 20px 30px;}
.cp-title{font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.12em;color:var(--text-3);margin-bottom:16px;}
.tool-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:22px;}
.tool-opt{display:flex;align-items:center;gap:12px;border:1px solid var(--border);background:var(--panel);
  padding:11px 13px;border-radius:var(--radius);transition:all .15s;}
.tool-opt.selected{border-color:var(--accent);background:rgba(247,220,0,0.06);}
.tool-icon{width:30px;height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--text-2);}
.tool-opt.selected .tool-icon{color:var(--accent);}
.tool-name{font-size:12.5px;font-weight:600;}

.slider-block{margin-bottom:22px;}
.slider-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
.slider-label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.09em;color:var(--text-2);}
.slider-value{font-family:var(--font-mono);font-size:15px;font-weight:600;color:var(--accent);}
input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:var(--border);border-radius:2px;outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:var(--accent);border-radius:50%;cursor:pointer;border:2px solid #0B0D0E;}
input[type=range]::-moz-range-thumb{width:14px;height:14px;background:var(--accent);border-radius:50%;cursor:pointer;border:2px solid #0B0D0E;}
.slider-help{font-size:11.5px;color:var(--text-3);margin-top:6px;line-height:1.4;}

.order-list{display:flex;flex-direction:column;gap:6px;margin-bottom:18px;}
.order-item{display:flex;align-items:center;justify-content:space-between;background:var(--panel);
  border:1px solid var(--border);padding:9px 12px;border-radius:var(--radius);font-size:12.5px;}
.order-item .oi-left{display:flex;align-items:center;gap:10px;}
.order-num{font-family:var(--font-mono);color:var(--accent);font-size:12px;}
.order-btns button{background:none;border:none;color:var(--text-3);font-size:13px;padding:2px 5px;}
.order-btns button:hover{color:var(--accent);}

.warn-strip{font-family:var(--font-mono);font-size:11px;color:#ffbf4d;background:rgba(255,191,77,0.08);
  border:1px solid rgba(255,191,77,0.3);padding:8px 10px;border-radius:2px;margin-bottom:14px;}

.status-bar{border-top:1px solid var(--border);background:var(--panel-deep);padding:14px 26px;display:grid;
  grid-template-columns:1fr 300px;gap:20px;align-items:center;}
.timeline{display:flex;gap:0;align-items:center;}
.tl-step{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;position:relative;}
.tl-step:not(:last-child)::after{content:'';position:absolute;top:5px;left:55%;width:90%;height:1px;background:var(--border);}
.tl-dot{width:11px;height:11px;border-radius:50%;background:var(--border);border:2px solid var(--border);z-index:1;transition:all .2s;}
.tl-step.active .tl-dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 8px rgba(247,220,0,0.6);}
.tl-step.done .tl-dot{background:var(--text-3);border-color:var(--text-3);}
.tl-label{font-family:var(--font-mono);font-size:9px;letter-spacing:0.06em;color:var(--text-3);}
.tl-step.active .tl-label{color:var(--accent);}
.log-panel{font-family:var(--font-mono);font-size:10.5px;color:var(--text-2);max-height:70px;overflow-y:auto;line-height:1.7;}
.log-panel .lg-title{color:var(--text-3);font-size:9px;letter-spacing:0.1em;margin-bottom:4px;}
.log-line span{color:var(--accent);}

/* ---------- results ---------- */
.result-hero{text-align:center;padding:40px 0 30px;}
.result-diam{font-family:var(--font-mono);font-size:56px;font-weight:600;color:var(--accent);}
.result-target{font-family:var(--font-mono);font-size:13px;color:var(--text-2);margin-top:6px;}
.tol-badge{display:inline-block;margin-top:16px;}
.score-big{text-align:center;padding:26px 0;}
.score-num{font-family:var(--font-mono);font-size:64px;font-weight:700;}
.score-of{font-family:var(--font-mono);font-size:20px;color:var(--text-3);}
.breakdown-row{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
.br-label{width:110px;font-family:var(--font-mono);font-size:11.5px;color:var(--text-2);}
.br-bar{flex:1;height:7px;background:var(--panel-elevated);border-radius:4px;overflow:hidden;}
.br-fill{height:100%;background:var(--accent);border-radius:4px;}
.br-val{width:56px;text-align:right;font-family:var(--font-mono);font-size:12px;color:var(--text);}

.evidence-row{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;
  border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;background:var(--panel);}

.readiness-banner{text-align:center;padding:34px 26px;border-radius:var(--radius);border:1px solid var(--border);margin-bottom:28px;}
.readiness-banner.near{border-color:rgba(247,220,0,0.4);background:rgba(247,220,0,0.05);}
.readiness-banner.ready{border-color:rgba(122,214,120,0.4);background:rgba(122,214,120,0.05);}
.readiness-tag{font-family:var(--font-mono);font-size:26px;font-weight:700;letter-spacing:0.04em;}
.readiness-tag.near{color:var(--accent);}
.readiness-tag.ready{color:#7ad678;}
.readiness-desc{color:var(--text-2);font-size:13.5px;margin-top:8px;}
.gap-card{display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);}
.gap-dot{width:9px;height:9px;border-radius:50%;background:#ff8a8a;flex-shrink:0;}

/* ---------- upskill ---------- */
.video-embed{width:100%;aspect-ratio:16/9;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:#000;}
.video-embed iframe{width:100%;height:100%;border:0;}

/* ---------- retest ---------- */
.retest-flow{display:flex;align-items:center;justify-content:center;gap:26px;flex-wrap:wrap;padding:30px 0;}
.retest-card{text-align:center;padding:24px 30px;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);min-width:150px;}
.retest-card .rc-num{font-family:var(--font-mono);font-size:38px;font-weight:700;}
.retest-card .rc-tag{font-family:var(--font-mono);font-size:11px;margin-top:4px;letter-spacing:0.08em;}
.retest-arrow{font-family:var(--font-mono);font-size:22px;color:var(--text-3);}

/* ---------- final profile ---------- */
.profile-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:20px;padding:30px;
  border:1px solid var(--border);border-radius:var(--radius);background:linear-gradient(135deg, var(--panel) 0%, var(--panel-deep) 100%);margin-bottom:28px;}
.profile-name{font-size:26px;font-weight:700;}
.profile-role{color:var(--text-2);font-size:14px;margin-top:4px;}
.readiness-pill{text-align:center;}
.readiness-pill .rp-num{font-family:var(--font-mono);font-size:38px;font-weight:700;color:var(--accent);}
.opp-card{padding:18px;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);margin-bottom:12px;
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}

/* ---------- msme ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:34px;}
.stat-card{padding:20px;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);}
.stat-num{font-family:var(--font-mono);font-size:32px;font-weight:700;}
.stat-label{font-size:11px;color:var(--text-2);letter-spacing:0.06em;margin-top:6px;font-family:var(--font-mono);}
.req-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
.req-tag{font-family:var(--font-mono);font-size:11px;padding:6px 12px;border:1px solid var(--border);border-radius:20px;color:var(--text-2);}

table{width:100%;border-collapse:collapse;}
th{text-align:left;font-family:var(--font-mono);font-size:10px;letter-spacing:0.08em;color:var(--text-3);
  padding:10px 14px;border-bottom:1px solid var(--border);}
td{padding:14px;border-bottom:1px solid var(--border);font-size:13.5px;}
tr.cand-row{cursor:pointer;transition:background .12s;}
tr.cand-row:hover{background:var(--panel);}
.name-cell{font-weight:600;}

.near-ready-card{padding:18px;border:1px solid rgba(247,220,0,0.35);background:rgba(247,220,0,0.05);border-radius:var(--radius);margin-bottom:12px;}

.report-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:20px;margin-bottom:26px;}
.log-table td, .log-table th{font-family:var(--font-mono);font-size:12px;}
.disclaimer{font-size:11.5px;color:var(--text-3);border-top:1px solid var(--border);padding-top:16px;margin-top:20px;line-height:1.5;}
.action-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel-elevated);
  border:1px solid var(--accent);color:var(--text);padding:12px 22px;border-radius:2px;font-size:13px;
  font-family:var(--font-mono);z-index:900;opacity:0;pointer-events:none;transition:opacity .25s;}
.toast.show{opacity:1;}

.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-2);font-size:12.5px;margin-bottom:20px;font-family:var(--font-mono);}
.back-link:hover{color:var(--accent);}

.ai-note{display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:10.5px;color:var(--text-3);
  border:1px dashed var(--border);padding:10px 14px;border-radius:var(--radius);margin:26px 0;}
.ai-note b{color:var(--text-2);}

@media (max-width:980px){
  .lab-body{grid-template-columns:1fr;grid-template-rows:1fr auto;}
  .controls-pane{border-left:none;border-top:1px solid var(--border);max-height:44vh;}
  .status-bar{grid-template-columns:1fr;}
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .grid-2{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div class="topnav">
  <div class="brand" onclick="goTo('landing')">
    <div class="brand-mark"></div>
    <div class="brand-name">KAARYA</div>
  </div>
  <div class="nav-right" id="navRight"></div>
</div>

<div id="app"></div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =========================================================================
   KAARYA — application state
   ========================================================================= */
const CAPABILITY_NAMES = ["CNC Turning","Tool Selection","Parameter Selection","Process Sequencing","Dimensional Control"];

const State = {
  view: 'landing',
  mode: 'candidate', // candidate | msme
  candidate: {
    name:'Ravi Kumar', education:'Diploma in Mechanical Engineering', experience:'1 Year',
    branch:'Manufacturing', targetRole:'CNC Machinist', built:false
  },
  lab: {

/* =========================================================================
   Deterministic assessment engine
   ========================================================================= */
function computeResult(params){
  const toolScoreMap = {finishing:23, general:17, roughing:10};
  const toolScore = toolScoreMap[params.tool] ?? 10;
  const rpmScore = Math.max(4, 18 - Math.abs(params.rpm-1800)*0.018);
  const feedScore = Math.max(4, 18 - Math.abs(params.feed-0.18)*70);
  const depthScore = Math.max(3, 12 - Math.abs(params.depth-0.80)*7);
  const orderCorrect = params.order.join(',') === 'rough,finish,measure';
  const processScore = orderCorrect ? 16 : 6;
  const total = Math.round(toolScore+rpmScore+feedScore+depthScore+processScore);

  const depthDeviation = params.depth-0.80;
  const feedDeviation = params.feed-0.18;
  const rpmDeviation = (params.rpm-1800)/1000;
  let diameter = 50.03 - depthDeviation*2.4 + feedDeviation*1.2 - rpmDeviation*0.15;
  if(!orderCorrect) diameter += 0.35;
  diameter = Math.round(diameter*100)/100;
  const withinTolerance = Math.abs(diameter-50.00) <= 0.05;

  const verified = {
    "CNC Turning": true,
    "Tool Selection": toolScore>=17,
    "Parameter Selection": (rpmScore+feedScore+depthScore) >= 35,
    "Process Sequencing": orderCorrect,
    "Dimensional Control": withinTolerance
  };
  const verifiedCount = Object.values(verified).filter(Boolean).length;

  let readiness = 'NOT READY';
  if(total>=90) readiness='READY'; else if(total>=75) readiness='NEAR-READY';

  return {
    params: JSON.parse(JSON.stringify(params)),
    toolScore:Math.round(toolScore), rpmScore:Math.round(rpmScore), feedScore:Math.round(feedScore),
    depthScore:Math.round(depthScore), processScore, total, diameter, withinTolerance,
    orderCorrect, verified, verifiedCount, readiness,
    capabilityMatch: Math.min(100, total+9),
    gap: verified["Dimensional Control"] && orderCorrect && toolScore>=20 ? null : "GD&T / Dimensional Interpretation"
  };
}

let machineRunning = false;
async function runMachine(){
  if(machineRunning) return;
  machineRunning = true;
  document.getElementById('runBtn').disabled = true;
  document.getElementById('runBtn').textContent = 'MACHINING…';
  document.querySelectorAll('.controls-pane input, .tool-opt, .order-btns button').forEach(e=>e.style.pointerEvents='none');

  const result = computeResult(State.lab);
  const ovStatus = document.getElementById('ovStatus');
  ovStatus.classList.add('show');

  renderTimeline(0);
  appendLog('Program loaded');
  await Machine.play(result, (phaseIdx, label)=>{
    renderTimeline(phaseIdx, phaseIdx);
    ovStatus.textContent = label==='COMPLETE' ? 'CYCLE COMPLETE' : (label==='MEASURING'?'MEASURING…':'MACHINING IN PROGRESS');
    if(label==='SPINDLE START') appendLog('Tool selected · Spindle started');
    if(label==='ROUGHING') appendLog('Roughing pass started');
    if(label==='FINISHING') appendLog('Roughing complete · Finishing pass started');
    if(label==='MEASURING') appendLog('Finishing complete · Measurement started');
    if(label==='COMPLETE') appendLog('Cycle complete — Ø'+result.diameter.toFixed(2)+' mm');
  }, (diam)=>{
    document.getElementById('ovCurrent').textContent = 'Ø'+diam.toFixed(2)+' mm';
    document.getElementById('ovX').textContent = (50+Math.random()*4).toFixed(1);
    document.getElementById('ovZ').textContent = (-20+Math.random()*18).toFixed(1);
  });

  machineRunning = false;
  State.attempt1 = result;
  await new Promise(r=>setTimeout(r,700));
  goTo('result');
}

    ${!a2 ? `<button class="btn btn-primary btn-block" style="margin-top:22px;" onclick="runRetest()">RUN REASSESSMENT <span class="arrow">→</span></button>`
         : `<button class="btn btn-primary btn-block" style="margin-top:22px;" onclick="goTo('profile')">VIEW FINAL PROFILE <span class="arrow">→</span></button>`}
  </div></div>`;
}
async function runRetest(){
  const idealParams = {tool:'finishing', rpm:1800, feed:0.18, depth:0.80, order:['rough','finish','measure']};
  const base = computeResult(idealParams);
  const boosted = JSON.parse(JSON.stringify(base));
  boosted.total = Math.min(100, base.total+7);
  boosted.readiness = boosted.total>=90 ? 'READY' : (boosted.total>=75?'NEAR-READY':'NOT READY');
  boosted.diameter = 50.01;
  boosted.verified = Object.assign({}, base.verified, {"Dimensional Control":true});
  boosted.verifiedCount = 5;
  boosted.gap = null;

  document.getElementById('retestStatus').style.display='block';
  document.getElementById('retestStatus').textContent = 'MACHINING IN PROGRESS';
  await Machine.play(base, ()=>{}, ()=>{});
  document.getElementById('retestStatus').textContent = 'CYCLE COMPLETE';
  await new Promise(r=>setTimeout(r,500));

  State.attempt2 = boosted;
  document.getElementById('retestNum').textContent = boosted.total;
  document.getElementById('retestTag').textContent = 'ATTEMPT 02 · '+boosted.readiness;
  document.getElementById('retestStatus').style.display='none';
}

/* =========================================================================
   THREE.JS — CNC MACHINE
   ========================================================================= */
const Machine = (function(){
  let renderer, scene, camera, group, spindleGroup, workpiece, toolGroup, statusLight, chips=[];
  let angle = {theta: Math.PI*0.32, phi: 1.05, radius: 8.5};
  let target = new THREE.Vector3(0, 1.05, 0);
  let running = false, rpm = 0;
  let hostEl = null;
  let ready = false;

  function build(){
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);

    const ambient = new THREE.AmbientLight(0x50565b, 1.25);
    scene.add(ambient);
    const key = new THREE.DirectionalLight(0xffffff, 1.05);
    key.position.set(6,10,5); key.castShadow=true;
    key.shadow.mapSize.set(1024,1024);
    key.shadow.camera.left=-8; key.shadow.camera.right=8;
    key.shadow.camera.top=8; key.shadow.camera.bottom=-8;
    scene.add(key);
    const rim = new THREE.PointLight(0xF7DC00, 0.55, 22);
    rim.position.set(-4,3,-2.5); scene.add(rim);
    const fill = new THREE.DirectionalLight(0x8fa2b0, 0.28);
    fill.position.set(-6,4,-6); scene.add(fill);

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(9,48),
      new THREE.MeshStandardMaterial({color:0x0c0e10, roughness:0.95, metalness:0.05})
    );
    floor.rotation.x = -Math.PI/2; floor.receiveShadow = true;
    scene.add(floor);

    group = new THREE.Group();

    const steel = new THREE.MeshStandardMaterial({color:0x1c2023, roughness:0.5, metalness:0.75});
    const steelDark = new THREE.MeshStandardMaterial({color:0x121517, roughness:0.55, metalness:0.7});
    const brushed = new THREE.MeshStandardMaterial({color:0x2b3134, roughness:0.35, metalness:0.85});
    const yellowMat = new THREE.MeshStandardMaterial({color:0xF7DC00, roughness:0.4, metalness:0.3, emissive:0x3a3300, emissiveIntensity:0.35});

    // bed
    const bed = new THREE.Mesh(new THREE.BoxGeometry(4.6,0.35,2.1), steel);
    bed.position.y = 0.18; bed.castShadow=true; bed.receiveShadow=true;
    group.add(bed);

    // headstock
    const headstock = new THREE.Mesh(new THREE.BoxGeometry(1.05,1.15,1.5), steelDark);
    headstock.position.set(-1.55, 0.95, 0); headstock.castShadow=true;
    group.add(headstock);

    // tailstock
    const tailstock = new THREE.Mesh(new THREE.BoxGeometry(0.55,0.6,1.0), steelDark);
    tailstock.position.set(2.05, 0.75, 0); tailstock.castShadow=true;
    group.add(tailstock);

    // rails
    [-0.35,0.35].forEach(zoff=>{
      const rail = new THREE.Mesh(new THREE.BoxGeometry(3.6,0.08,0.12), brushed);
      rail.position.set(0.25, 0.55, zoff*1.2);
      group.add(rail);
    });

    // spindle group (rotates) holding chuck + workpiece, axis along X (headstock -> tailstock)
    spindleGroup = new THREE.Group();
    spindleGroup.position.set(-1.0, 0.95, 0);
    group.add(spindleGroup);

    const chuck = new THREE.Mesh(
      new THREE.CylinderGeometry(0.32,0.32,0.28,24),
      brushed
    );
    chuck.rotation.z = Math.PI/2; chuck.position.x = 0.18; chuck.castShadow=true;
    spindleGroup.add(chuck);

    const wpGeo = new THREE.CylinderGeometry(0.55,0.55,2.1,32);
    workpiece = new THREE.Mesh(wpGeo, new THREE.MeshStandardMaterial({color:0x9aa1a6, roughness:0.32, metalness:0.85}));
    workpiece.rotation.z = Math.PI/2;
    workpiece.position.x = 1.35;
    workpiece.castShadow = true;
    spindleGroup.add(workpiece);
    workpiece.userData.baseRadius = 0.55;

    // tool carriage
    toolGroup = new THREE.Group();
    toolGroup.position.set(1.35, -1.15, 0); // relative offset added below via world pos calc
    const holder = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.35,0.35), steel);
    holder.castShadow = true;
    toolGroup.add(holder);
    const bit = new THREE.Mesh(new THREE.BoxGeometry(0.32,0.1,0.1), new THREE.MeshStandardMaterial({color:0xd8d8d8, roughness:0.25, metalness:0.9}));
    bit.position.set(-0.35, 0.02, 0);
    toolGroup.add(bit);
    group.add(toolGroup);
    // toolGroup local coords: x = retract/advance offset from base, z = travel along workpiece length, y fixed near workpiece height
    toolGroup.position.set(1.6, 0.95, 0);

    // control panel
    const panel = new THREE.Mesh(new THREE.BoxGeometry(0.4,0.55,0.12), steelDark);
    panel.position.set(-2.05, 1.15, 0.85);
    group.add(panel);
    statusLight = new THREE.Mesh(new THREE.SphereGeometry(0.045,12,12), new THREE.MeshStandardMaterial({color:0x333333, emissive:0x111100, emissiveIntensity:0.3}));
    statusLight.position.set(-2.05, 1.35, 0.92);
    group.add(statusLight);

    // enclosure (glass)
    const enclosure = new THREE.Mesh(
      new THREE.BoxGeometry(5.2,2.3,2.6),
      new THREE.MeshPhysicalMaterial({color:0x8fd6ff, transparent:true, opacity:0.06, roughness:0.1, metalness:0, side:THREE.DoubleSide})
    );
    enclosure.position.set(0.1,1.3,0);
    group.add(enclosure);
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(enclosure.geometry), new THREE.LineBasicMaterial({color:0xF7DC00, transparent:true, opacity:0.35}));
    edges.position.copy(enclosure.position);
    group.add(edges);

    scene.add(group);
  }

  function updateCamera(){
    const p = new THREE.Vector3(
      target.x + angle.radius*Math.sin(angle.phi)*Math.cos(angle.theta),
      target.y + angle.radius*Math.cos(angle.phi),
      target.z + angle.radius*Math.sin(angle.phi)*Math.sin(angle.theta)
    );
    camera.position.copy(p);
    camera.lookAt(target);
  }

  function setRadius(r){
    const ratio = r/workpiece.userData.baseRadius;
    workpiece.scale.set(1, ratio, ratio); // cylinder axis local Y -> radial scale applies to y&z after our rotation.z=PI/2 (axis now X); local y&z are radial
  }

  function fit(){
    if(!hostEl) return;
    const w = hostEl.clientWidth || 400, h = hostEl.clientHeight || 300;
    renderer.setSize(w,h,false);
    camera.aspect = w/h;
    camera.updateProjectionMatrix();
  }

  function attachTo(hostId){
    const host = document.getElementById(hostId);
    if(!host) return;
    hostEl = host;
    if(!renderer){
      renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
      renderer.shadowMap.enabled = true;
      renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
      build();
      updateCamera();
      bindPointer(renderer.domElement);
      startLoop();
      window.addEventListener('resize', fit);
    }
    if(renderer.domElement.parentElement !== host){
      host.appendChild(renderer.domElement);
      renderer.domElement.style.width='100%';
      renderer.domElement.style.height='100%';
      renderer.domElement.style.display='block';
      renderer.domElement.style.cursor='grab';
    }
    fit();
    ready = true;
  }

  function bindPointer(dom){
    let dragging=false, lx=0, ly=0;
    dom.addEventListener('pointerdown', e=>{dragging=true; lx=e.clientX; ly=e.clientY; dom.style.cursor='grabbing';});
    window.addEventListener('pointerup', ()=>{dragging=false; dom.style.cursor='grab';});
    window.addEventListener('pointermove', e=>{
      if(!dragging) return;
      const dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY;
      angle.theta -= dx*0.006;
      angle.phi = Math.min(1.9, Math.max(0.5, angle.phi - dy*0.006));
      updateCamera();
    });
    dom.addEventListener('wheel', e=>{
      e.preventDefault();
      angle.radius = Math.min(15, Math.max(4.5, angle.radius + e.deltaY*0.01));
      updateCamera();
    }, {passive:false});
  }

  function startLoop(){
    function loop(){
      requestAnimationFrame(loop);
      const speed = running ? Math.max(0.04, rpm/3000*0.55) : 0.006;
      if(spindleGroup) spindleGroup.rotation.x += speed;
      updateChips();
      if(statusLight){
        statusLight.material.emissiveIntensity = running ? (0.6+Math.sin(performance.now()*0.01)*0.3) : 0.15;
        statusLight.material.emissive.set(running?0xF7DC00:0x222200);
      }
      if(renderer && scene && camera) renderer.render(scene, camera);
    }
    loop();
  }

  function spawnChip(){
    if(!toolGroup) return;
    const geo = new THREE.BoxGeometry(0.04,0.02,0.05);
    const mat = new THREE.MeshStandardMaterial({color:0xC9A227, roughness:0.6, metalness:0.5});
    const chip = new THREE.Mesh(geo, mat);
    const wp = new THREE.Vector3(); workpiece.getWorldPosition(wp);
    chip.position.copy(toolGroup.position).add(new THREE.Vector3(-0.15,0.1,0));
    chip.userData = {vel: new THREE.Vector3((Math.random()-0.5)*0.01, 0.02+Math.random()*0.02, (Math.random()-0.5)*0.02), life:1};
    group.add(chip);
    chips.push(chip);
    if(chips.length>25){ const old=chips.shift(); group.remove(old); }
  }
  function updateChips(){
    chips.forEach(c=>{
      c.position.add(c.userData.vel);
      c.userData.vel.y -= 0.0015;
      c.userData.life -= 0.018;
      c.material.opacity = Math.max(0, c.userData.life);
      c.material.transparent = true;
    });
    chips = chips.filter(c=>{
      if(c.userData.life<=0){ group.remove(c); return false; }
      return true;
    });
  }

  function lerp(a,b,t){ return a+(b-a)*t; }
  function tween(duration, onUpdate){
    return new Promise(res=>{
      const start = performance.now();
      function step(now){
        const p = Math.min(1, (now-start)/duration);
        onUpdate(p);
        if(p<1) requestAnimationFrame(step); else res();
      }
      requestAnimationFrame(step);
    });
  }
  function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }

  async function play(result, onPhase, onDiameter){
    const startR = 0.55, roughR = Math.max(0.5, (0.55+ (result.diameter/100))/2 + 0.01), finalR = Math.max(0.48, result.diameter/100);
    running = false; rpm = result.params.rpm;
    setRadius(startR);
    toolGroup.position.set(1.6, 0.95, -0.9);

    onPhase(0,'INITIALISING'); await wait(450);

    onPhase(1,'SPINDLE START'); running = true;
    await tween(500, p=>{ toolGroup.position.x = lerp(1.6, 1.0+startR, p); });

    onPhase(2,'ROUGHING');
    await tween(1250, p=>{
      toolGroup.position.z = lerp(-0.9, 0.9, p);
      const r = lerp(startR, roughR, p);
      setRadius(r);
      onDiameter(r*100);
      if(Math.random()<0.35) spawnChip();
    });

    onPhase(3,'FINISHING');
    toolGroup.position.z = -0.9;
    await tween(1250, p=>{
      toolGroup.position.x = lerp(1.0+roughR, 1.0+finalR, p);
      toolGroup.position.z = lerp(-0.9, 0.9, p);
      const r = lerp(roughR, finalR, p);
      setRadius(r);
      onDiameter(r*100);
      if(Math.random()<0.35) spawnChip();
    });

    onPhase(4,'MEASURING');
    await tween(400, p=>{ toolGroup.position.x = lerp(1.0+finalR, 1.6, p); });
    await wait(700);

    onPhase(5,'COMPLETE');
    running = false;
    onDiameter(result.diameter);
  }

  return { attachTo, play, get ready(){ return ready; } };
})();

/* =========================================================================
   Sound (optional, muted by default)
   ========================================================================= */
let audioCtx=null, osc=null, gainNode=null, soundOn=false;
function toggleSound(){
  soundOn = !soundOn;
  const btn = document.getElementById('soundBtn');
  if(btn) btn.textContent = soundOn ? '🔊' : '🔇';
  if(soundOn && !audioCtx){
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    osc = audioCtx.createOscillator(); osc.type='sawtooth'; osc.frequency.value=60;
    gainNode = audioCtx.createGain(); gainNode.gain.value=0.0;
    osc.connect(gainNode); gainNode.connect(audioCtx.destination);
    osc.start();
  }
  if(gainNode) gainNode.gain.value = soundOn ? 0.02 : 0.0;
}

/* =========================================================================
   after render — attach 3D host + misc bindings
   ========================================================================= */
function afterRender(){
  if(State.view==='landing'){
    Machine.attachTo('heroMachineHost');
  } else if(State.view==='lab'){
    Machine.attachTo('viewportHost');
    renderOrderList();
    renderTimeline(-1);
  } else if(State.view==='retest'){
    Machine.attachTo('retestViewportHost');
  }
}

render();
</script>
